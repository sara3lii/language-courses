<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us - Language Mastery</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

  <!-- Font Tajawal -->
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark" style="background-color: #0048BA;">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">Language Mastery</a>
  </div>
</nav>

<!-- Contact Section -->
<section class="py-5" style="background: linear-gradient(to right, #0048BA, #5DA9E9); color: white;">
  <div class="container text-center">
    <h1 class="fw-bold mb-4">تواصل معنا 📩</h1>
    <p class="lead">نسعد بتواصلك معنا لأي استفسارات أو اقتراحات!</p>
  </div>
</section>

<section class="py-5">
  <div class="container">
    <form>
      <div class="mb-3">
        <label for="name" class="form-label">الاسم الكامل</label>
        <input type="text" class="form-control" id="name" placeholder="أدخل اسمك">
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">البريد الإلكتروني</label>
        <input type="email" class="form-control" id="email" placeholder="أدخل بريدك الإلكتروني">
      </div>
      <div class="mb-3">
        <label for="message" class="form-label">رسالتك</label>
        <textarea class="form-control" id="message" rows="5" placeholder="اكتب رسالتك هنا..."></textarea>
      </div>
      <button type="submit" class="btn btn-primary">إرسال</button>
    </form>
  </div>
</section>

<!-- Footer -->
<footer class="text-white text-center py-3" style="background-color: #0048BA;">
  <p>© 2025 Language Mastery. جميع الحقوق محفوظة.</p>
</footer>

<!-- Bootstrap Script -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
